spring.application.name=momo-bill-payment-backend
server.port=8080

# --- PostgreSQL ---
# Set these via environment variables in production; defaults below are for local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/momo_bills}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" is convenient for hackathon speed; switch to migrations (e.g. Flyway) before production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Gemini chatbot (placeholder - wire up when ready) ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
