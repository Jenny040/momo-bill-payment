server:
  port: 8080

spring:
  application:
    name: momo-miniapp-backend
  main:
    allow-bean-definition-overriding: true

  # H2 Database for testing (no setup needed)
  datasource:
    url: jdbc:h2:mem:momo_miniapp
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ============================================================
# MoMo API Configuration
# ============================================================
momo:
  api:
    base-url: ${MOMO_API_BASE_URL:https://sandbox.momodeveloper.mtn.com}
    subscription-key: ${MOMO_API_SUBSCRIPTION_KEY:}
    api-user: ${MOMO_API_USER:}
    api-key: ${MOMO_API_KEY:}
      target-environment: ${MOMO_TARGET_ENVIRONMENT:sandbox}

# ============================================================
# Chatbot Configuration
# ============================================================
chatbot:
  base-url: ${CHATBOT_URL:http://localhost:8001}

# ============================================================
# Gemini API Configuration
# ============================================================
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent