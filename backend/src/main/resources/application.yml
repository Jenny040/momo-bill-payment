server:
  port: 8080

spring:
  application:
    name: momo-miniapp-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:momo_miniapp}
    username: ${DB_USER:momo}
    password: ${DB_PASSWORD:momo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

chatbot:
  base-url: ${CHATBOT_URL:http://localhost:8001}

momo:
  api:
    base-url: ${MOMO_API_BASE_URL:}
    subscription-key: ${MOMO_API_SUBSCRIPTION_KEY:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent