version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: momo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: momo_miniapp
      POSTGRES_USER: momo
      POSTGRES_PASSWORD: momo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momo -d momo_miniapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: momo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  chatbot:
    build: ./chatbot
    container_name: momo_chatbot
    restart: unless-stopped
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    container_name: momo_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - chatbot
    ports:
      - "4200:80"

volumes:
  pgdata:
